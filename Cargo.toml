[package]
name = "mcpdoc-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust MCP server for llms.txt documentation retrieval with BM25 full-text search"
authors = ["stephen ho <mrfangbianmian@163.com>"]
license = "MIT"
repository = "https://github.com/heweijian4933/mcpdoc-rust"
homepage = "https://github.com/heweijian4933/mcpdoc-rust"
documentation = "https://docs.rs/mcpdoc-rust"
readme = "README.md"
keywords = ["mcp", "llms-txt", "documentation", "bm25", "search"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mcpdoc_rust"
path = "src/lib.rs"

[[bin]]
name = "mcpdoc-rust"
path = "src/main.rs"

[dependencies]
# ========== 异步运行时 ==========
tokio = { version = "1.40", features = ["full", "fs", "io-util"] }

# ========== MCP 协议 ==========
# server feature 含 transport-async-rw(stdio),transport-sse-server 引入 axum(SSE)
rmcp = { version = "0.2", features = ["server", "transport-sse-server"] }

# ========== HTTP 客户端 ==========
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }

# ========== HTML 解析 ==========
scraper = "0.20"

# ========== Markdown 处理 ==========
pulldown-cmark = { version = "0.12", features = ["html"] }

# ========== 全文搜索(BM25)==========
tantivy = "0.22"

# ========== 文本处理 ==========
rust-stemmers = "1.2"
regex = "1.10"

# ========== 目录遍历 ==========
walkdir = "2.5"

# ========== 序列化 ==========
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# ========== 并发/缓存 ==========
dashmap = "6.1"
once_cell = { version = "1.20", features = ["race"] }

# ========== URL 解析 ==========
url = "2.5"

# ========== 日志 ==========
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ========== 错误处理 ==========
anyhow = "1.0"
thiserror = "1.0"

# ========== JSON Schema(MCP 工具参数需要)==========
schemars = "0.8"

# ========== 命令行解析 ==========
clap = { version = "4.5", features = ["derive"] }

# ========== 时间处理 ==========
jiff = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
